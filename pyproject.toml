[project]
name = "devmem"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "python-ulid>=4.1.0",
    "ruff>=0.17.2",
    "typer>=0.28.0",
]

[project.scripts]
dm = "devmem.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

 
[tool.hatch.build.targets.wheel]
packages = ["src/devmem"]
 
[tool.pytest.ini_options]
testpaths = ["tests"]
 

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true